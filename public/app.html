<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://egvxyzdipuyixqtmeqkk.supabase.co; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#a9e3f1" />
  <title>Summer Reading Challenge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script src="vendor/supabase.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <p class="wordmark">
        <svg class="wordmark-sun" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="13" fill="#ffc23a"/><circle cx="16" cy="16" r="5" fill="#fff6d2" opacity="0.8"/></svg>
        <span data-i18n="appTitle">Summer Reading Challenge</span>
      </p>
      <div class="header-actions">
        <button id="langToggle" class="floating-lang-toggle" type="button" aria-label="Change language / Huri reo">
          <span data-lang-opt="en">ENG</span><span class="divider">/</span><span data-lang-opt="mi">MĀO</span>
        </button>
        <div class="profile" id="profileInitial" aria-hidden="true">·</div>
        <button id="signOutBtn" class="btn btn-ghost" type="button" data-i18n="signOut">Sign out</button>
      </div>
    </div>
  </header>

  <section class="coast" aria-labelledby="welcomeMessage">
    <div class="coast-frame" id="coast">
      <div class="coast-text">
        <h2 id="welcomeMessage">Kia ora!</h2>
        <p id="communityLine"></p>
        <div class="goal-meter" aria-hidden="true"><i id="goalFill"></i></div>
        <p class="goal-cap"><span id="goalPct"></span><span id="goalOf"></span></p>
      </div>
    </div>
  </section>

  <main class="dash" id="dashboard" aria-busy="true">
    <div class="stats">
      <div class="stat clay minutes"><div class="stat-value" id="myMinutes">0</div><div class="stat-label" data-i18n="yourMinutes"></div></div>
      <div class="stat clay streak"><div class="stat-value" id="streak">0</div><div class="stat-label" data-i18n="daysStreak"></div></div>
      <div class="stat clay stat-rank"><div class="stat-value" id="rank">–</div><div class="stat-label" data-i18n="yourRank"></div></div>
      <button id="logBtn" class="btn btn-primary log-cta" type="button">📖 <span data-i18n="logMyReading">Log my reading</span></button>
    </div>

    <p id="closedBanner" class="notice banner closed-banner hidden" data-i18n="closed"></p>
    <p id="pageMessage" class="message banner" role="status" aria-live="polite"></p>
    <div id="prizes"></div>
    <div id="newsFlash"></div>

    <div class="grid">
      <section class="card" aria-labelledby="bingoHeading">
        <div class="section-head">
          <h3 id="bingoHeading"><span class="emoji" aria-hidden="true">🏖️</span><span data-i18n="bingo">Summer bingo</span></h3>
          <p data-i18n="bingoHint"></p>
        </div>
        <div id="bingoBoard" class="bingo-board"></div>
        <p id="bingoMessage" class="message ok bingo-message" role="status" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="leadersHeading">
        <div class="section-head">
          <h3 id="leadersHeading"><span class="emoji" aria-hidden="true">🏆</span><span data-i18n="topReaders">Top readers</span></h3>
        </div>
        <ol id="leaderboard" class="list"></ol>
      </section>
    </div>

    <div class="grid grid-even">
      <section class="card" aria-labelledby="shelfHeading">
        <div class="section-head">
          <h3 id="shelfHeading"><span class="emoji" aria-hidden="true">📚</span><span data-i18n="myBookshelf">My bookshelf</span></h3>
          <p id="shelfHint" data-i18n="shelfHint"></p>
        </div>
        <ul id="bookshelf" class="shelf scroll"></ul>
      </section>

      <section class="card" aria-labelledby="favsHeading">
        <div class="section-head">
          <h3 id="favsHeading"><span class="emoji" aria-hidden="true">⭐</span><span data-i18n="communityFavs">Community favourites</span></h3>
        </div>
        <ol id="favourites" class="list"></ol>
      </section>
    </div>

    <div class="grid grid-even">
      <section class="card" aria-labelledby="recentHeading">
        <div class="section-head">
          <h3 id="recentHeading"><span class="emoji" aria-hidden="true">🕒</span><span data-i18n="recentReading">My recent reading</span></h3>
        </div>
        <ol id="recent" class="list"></ol>
      </section>

      <section class="card" aria-labelledby="newsHeading">
        <div class="section-head">
          <h3 id="newsHeading"><span class="emoji" aria-hidden="true">📣</span><span data-i18n="news">News</span></h3>
        </div>
        <div id="news" class="news"></div>
      </section>
    </div>
  </main>

  <div class="dash account-zone">
    <button id="deleteAccountBtn" class="btn btn-small" type="button" data-i18n="deleteAccount">Delete my account</button>
  </div>

  <div id="footerSlot"></div>

  <!-- You won! (shown once per prize) -->
  <dialog id="prizeDialog" class="modal prize-modal" aria-labelledby="prizeDialogTitle">
    <div class="prize-dialog-icon" aria-hidden="true">🎉</div>
    <h3 id="prizeDialogTitle"></h3>
    <p data-i18n="prizeBody"></p>
    <p id="prizeDialogWhen" class="strong"></p>
    <div class="modal-actions">
      <button id="prizeDialogOk" class="btn btn-primary" type="button" data-i18n="prizeOk">Yay!</button>
    </div>
  </dialog>

  <!-- Delete account -->
  <dialog id="deleteDialog" class="modal" aria-labelledby="deleteTitle">
    <form id="deleteForm" class="stack" autocomplete="off">
      <h3 id="deleteTitle" data-i18n="deleteTitle">Delete your account?</h3>
      <p data-i18n="deleteBody"></p>
      <label for="deleteConfirm"><span id="deleteConfirmLabel"></span>
        <input id="deleteConfirm" autocomplete="off" spellcheck="false" />
      </label>
      <p id="deleteMessage" class="message" role="status" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="deleteCancel" class="btn btn-secondary" type="button" data-i18n="cancel">Cancel</button>
        <button class="btn btn-small danger" type="submit" data-i18n="deleteForever">Delete my account</button>
      </div>
    </form>
  </dialog>

  <!-- Log reading -->
  <dialog id="logDialog" class="modal" aria-labelledby="logTitle">
    <button class="btn btn-secondary modal-close" type="button" data-close aria-label="Close">✕</button>
    <h3 id="logTitle" data-i18n="logMyReading">Log my reading</h3>
    <div class="autocomplete">
      <label for="bookTitle" data-i18n="whatBook">What are you reading?</label>
      <input id="bookTitle" type="text" maxlength="200" autocomplete="off" data-i18n-placeholder="bookTitlePlaceholder"
             role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" />
      <ul id="suggestions" class="suggestions hidden" role="listbox"></ul>
    </div>

    <div class="segmented" role="tablist">
      <button type="button" role="tab" id="tabType" aria-selected="true" aria-controls="panelType" data-i18n="typeIt">Type it in</button>
      <button type="button" role="tab" id="tabTimer" aria-selected="false" aria-controls="panelTimer" data-i18n="useTimer">Use the timer</button>
    </div>

    <form id="panelType" role="tabpanel" aria-labelledby="tabType" autocomplete="off">
      <p class="field-label" id="minsLabel" data-i18n="howMany">How many minutes?</p>
      <div class="chips" id="minuteChips" role="group" aria-labelledby="minsLabel"></div>
      <label class="field-label" for="minutes"><span data-i18n="otherAmount">Or type minutes</span>
        <input id="minutes" type="number" inputmode="numeric" min="1" max="120" data-i18n-placeholder="minsPlaceholder" />
      </label>
      <p class="tiny-note" id="maxSessionNote"></p>
      <div class="modal-actions">
        <button class="btn btn-primary" type="submit" data-i18n="saveSession">Save</button>
      </div>
    </form>

    <div id="panelTimer" role="tabpanel" aria-labelledby="tabTimer" class="timer-face hidden">
      <span id="timerDisplay" class="digital-clock">00:00</span>
      <button id="timerBtn" class="btn btn-sea" type="button" data-i18n="startTimer">Start timer</button>
      <p class="tiny-note" data-i18n="timerHint"></p>
    </div>

    <p id="logMessage" class="message" role="status" aria-live="polite"></p>
  </dialog>

  <!-- Pick a name -->
  <dialog id="nameDialog" class="modal" aria-labelledby="nameTitle">
    <form method="dialog" id="nameForm" class="stack">
      <h3 id="nameTitle" data-i18n="welcomeTitle"></h3>
      <p data-i18n="pickName"></p>
      <p class="tiny-note" data-i18n="noRealNames"></p>
      <label class="sr-only" for="nameInput">Display name</label>
      <input id="nameInput" maxlength="20" data-i18n-placeholder="namePlaceholder" autocomplete="off" required />
      <button id="nameIdea" class="btn btn-secondary btn-small" type="button" data-i18n="nameIdea">🎲 Pick one for me</button>
      <p id="nameMessage" class="message" role="status" aria-live="polite"></p>
      <button class="btn btn-primary" type="submit" data-i18n="startReading"></button>
    </form>
  </dialog>

  <!-- Bingo square -->
  <dialog id="bingoDialog" class="modal" aria-labelledby="bingoTitle">
    <div class="bingo-dialog-icon" id="bingoIcon" aria-hidden="true"></div>
    <h3 id="bingoTitle"></h3>
    <p id="bingoDescription"></p>
    <p id="bingoBonus" class="strong"></p>
    <div class="modal-actions">
      <button id="bingoCancel" class="btn btn-secondary" type="button" data-i18n="cancel"></button>
      <button id="bingoConfirm" class="btn btn-primary" type="button"></button>
    </div>
  </dialog>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script type="module" src="js/app.js"></script>
</body>
</html>
